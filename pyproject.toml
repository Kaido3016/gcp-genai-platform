[project]
name = "gcp-genai-platform"
version = "0.1.0"
description = "Vertex AI / Gemini RAG + Agentic AI portfolio platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "python-multipart>=0.0.12",
    "pypdf>=5.0,<7",
    "python-docx>=1.1,<2",
]

[project.optional-dependencies]
gcp = [
    "google-genai>=0.3.0",
    "google-cloud-aiplatform>=1.70",
    "google-cloud-storage>=2.18",
    "google-cloud-logging>=3.11",
]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5.0,<6",
    "httpx>=0.27,<1",
    "ruff>=0.7,<1",
    "mypy>=1.11,<2",
    "types-requests",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
