name: CI

# NOTE: this workflow configuration has been authored and syntax-checked
# but NOT executed by GitHub Actions in this environment (no CI account /
# network access from this sandbox). It will run for real the first time
# this repo is pushed to GitHub. See FINAL_AUDIT.md for what has and has
# not actually been executed so far.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # Install the project itself so that the "app" package is importable
      # in the GitHub Actions environment, while also installing dev tools.
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Ruff lint
        run: python -m ruff check app tests evaluation

      - name: Check Ruff formatting
        run: python -m ruff format --check app tests evaluation

      - name: Run mypy
        run: python -m mypy app

  unit-and-integration-tests:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # Install the project itself so tests/conftest.py can import "app".
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: >
          python -m pytest
          tests/unit
          tests/integration
          tests/e2e
          -v
          --cov=app
          --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn

  evaluation:
    runs-on: ubuntu-latest
    needs: unit-and-integration-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # The evaluation module imports application code, so install the package.
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run evaluation
        run: python -m evaluation.run_evaluation

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: evaluation/results/
          if-no-files-found: warn

  dependency-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Audit dependencies
        run: python -m pip_audit -r requirements.txt -r requirements-gcp.txt

  codeql:
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3

  docker-build:
    runs-on: ubuntu-latest
    needs: unit-and-integration-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: gcp-genai-platform:ci